; darkness2_vr.ini - The Darkness II VR mod. Written by the mod when absent.
; Lines starting with ; are comments. Every lever here defaults OFF or to the
; stock behaviour; the log (darkness2_vr.log) says what each run RESOLVED.

[Config]
Version=1

[Log]
; error|warn|info|debug|trace for every category; the D2VR_LOG environment
; variable overrides this. Cats opens one lane: canary:debug,present:trace
Level=info
Cats=

[Paths]
; Harness files (command.txt, ack.txt, status.json, dumps, shots). Empty =
; %LOCALAPPDATA%\Darkness2VR; the D2VR_DATA_DIR environment variable overrides.
DataDir=

[Canary]
; R1 (docs/ROADMAP.md): four in-memory code hooks that do nothing but count,
; to measure whether CEG tolerates them. Default OFF. A soak run sets them ON;
; the seam word `canary <cold|tick|callsite|hot> on|off` flips them live.
Cold=0
Tick=0
CallSite=0
Hot=0
; The per-canary hits/s and byte re-read line cadence, in seconds.
LogEverySeconds=1
