; darkness2_vr.ini - The Darkness II VR mod. Written by the mod when absent.
; Lines starting with ; are comments. Every lever here defaults OFF or to the
; stock behaviour; the log (darkness2_vr.log) says what each run RESOLVED.

[Config]
Version=1

[Log]
; error|warn|info|debug|trace for every category; the D2VR_LOG environment
; variable overrides this. Cats opens one lane: canary:debug,present:trace
Level=info
Cats=

[Paths]
; Harness files (command.txt, ack.txt, status.json, dumps, shots). Empty =
; %LOCALAPPDATA%\Darkness2VR; the D2VR_DATA_DIR environment variable overrides.
DataDir=

[Canary]
; R1 (docs/ROADMAP.md): four in-memory code hooks that do nothing but count,
; to measure whether CEG tolerates them. Default OFF. A soak run sets them ON;
; the seam word `canary <cold|tick|callsite|hot> on|off` flips them live.
Cold=0
Tick=0
CallSite=0
Hot=0
; The per-canary hits/s and byte re-read line cadence, in seconds.
LogEverySeconds=1

[Lua]
; R2 (docs/ROADMAP.md), the Lua lane: Enabled=1 installs three byte-verified wraps from the
; first present (ScriptSystem::Resume, lua_resume, lua_pcall) so that `lua run <text>` and
; `lua fov <deg>` run ONE chunk of the mod's own text on the engine's main lua_State, on the
; game thread, at the engine's own script entry. Default OFF. `lua on|off` flips it live;
; `lua status` prints the counters; the re-read line follows [Canary] LogEverySeconds.
Enabled=0

[VR]
; The OpenXR runtime layer. Runtime=auto takes the 32-bit runtime the system
; registers (Virtual Desktop's VDXR, Oculus) and falls back to the bundled SteamVR
; shim (d2vr_steamvr32.dll) when there is none and it ships; native|steamvr force one.
Runtime=auto
; XrRuntimeJson= a runtime manifest for THIS launch (the simulator, or a Steam launch
; that cannot carry XR_RUNTIME_JSON). Empty = the loader's choice. A stale value from
; a simulator run keeps the headset dark: tools\xrsim-launch.ps1 restores it.
XrRuntimeJson=
; A 64-bit implicit OpenXR API layer (an OBS mirror, say) fails xrCreateInstance in
; this 32-bit process for every runtime. 1 = opt this process out of such a layer
; through the layer's own disable variable (the registry is never written); 0 = report only.
DisableBadApiLayers=1

[Screen]
; Rung 1, the mono screen: the game frame on a quad DistanceMeters away and WidthMeters
; wide, the same image in both eyes. HeadLocked=1 keeps it in front of your eyes (turning
; your head turns the screen with it); 0 leaves it standing in the room. Live: `screen
; <distM> <widthM>` and `screen headlock on|off`.
DistanceMeters=1.75
WidthMeters=2.4
HeadLocked=1

[Stereo]
; The stereo method the seam starts on: mono (rung 1, works) | aer | reentry (registered
; stubs that refuse and leave mono running). `stereo <name>` switches live; `stereo status`.
Method=mono
; Armed=0 parks the selected method (the game runs flat, the seam stays up).
Armed=1

[Capture]
; How the D3D9 backbuffer reaches the D3D11 texture the runtime submits:
;   sync     GetRenderTargetData + LockRect + upload, on the present thread, this present
;   deferred the same readback queued one present behind (hides the CPU wait)
;   shared   a fenced StretchRect into a D3D9Ex shared surface D3D11 opens (no readback);
;            needs [Device] Ex=1 and the probe's AVAILABLE
;   off      the live A/B: the picture freezes
; `capture mode <name>` switches live; `capture` prints the cost per present.
Mode=deferred
; SharedWait=0 delivers the previous present's shared slot (no wait); 1 waits for this one's fence.
SharedWait=0
; The content bounding-box sample cadence in ms (each is a full-frame CPU readback); 0 = off.
BboxMs=30000

[Device]
; This game creates its own D3D9Ex device (ENGINE_NOTES s2), so Ex here does not create
; one: Ex=1 PERMITS the shared-surface capture on it, Ex=0 forces the readback modes.
Ex=1
